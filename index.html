<html lang="es">

        body { background-color: #f8f9fa; }

        .table-hover tbody tr:hover { background-color: #e9ecef; }
        .cart-panel {
            position: fixed;

            right: -400px;
            width: 400px;
            height: 100vh;
            background: white;
            box-shadow: -2px 0 5px rgba(0,0,0,0.2);

            z-index: 1050;
            display: flex;
            flex-direction: column;
        }
        .cart-panel.open { right: 0; }
        .cart-header { padding: 15px; border-bottom: 1px solid #ddd; background: #0d6efd; color: white; display: flex; justify-content: space-between; align-items: center; }
        .cart-body { padding: 15px; overflow-y: auto; flex-grow: 1; }
        .cart-footer { padding: 15px; border-top: 1px solid #ddd; background: #f8f9fa; }
        .overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.5); z-index: 1040; display: none;
        }
        .overlay.show { display: block; }
        .qty-input { width: 80px; text-align: center; }
        .badge-cyber { background-color: #dc3545; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container-fluid">
        <a class="navbar-brand" href="#"><i class="bi bi-cart-plus-fill"></i> Cyber Monday - Droguería Ñuñoa</a>
        <button class="btn btn-warning position-relative" onclick="toggleCart()">
            <i class="bi bi-cart"></i> Mi Carrito
            <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cartBadge">0</span>
        </button>
    </div>
</nav>

<div class="container-fluid py-4">
    <div class="row mb-3">
        <div class="col-md-6">
            <ul class="nav nav-pills" id="myTab" role="tablist">
                <li class="nav-item" role="presentation">
                    <button class="nav-link active" id="farma-tab" data-bs-toggle="pill" data-bs-target="#farma" type="button" role="tab" onclick="currentTab='pharma'; renderTable();">Farma</button>
                </li>
                <li class="nav-item" role="presentation">
                    <button class="nav-link" id="perf-tab" data-bs-toggle="pill" data-bs-target="#perf" type="button" role="tab" onclick="currentTab='perf'; renderTable();">Perfumería</button>
                </li>
            </ul>
        </div>
        <div class="col-md-6">
            <input type="text" id="searchInput" class="form-control" placeholder="Buscar producto o marca..." onkeyup="renderTable()">
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0 table-responsive" style="height: 75vh; overflow-y: auto;">
            <table class="table table-hover table-striped align-middle mb-0">
                <thead class="table-dark sticky-top">
                    <tr>
                        <th>Marca</th>
                        <th>Nombre</th>
                        <th>Vcto.</th>
                        <th>P. Referencia</th>
                        <th>P. Oferta</th>
                        <th>Dscto.</th>
                        <th title="Stock histórico aproximado">Stock*</th>
                        <th title="Ventas promedio">Ventas*</th>
                        <th class="text-center">Cant. a Pedir</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Filas renderizadas por JS -->
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Cart Sidebar -->
<div class="overlay" id="overlay" onclick="toggleCart()"></div>
<div class="cart-panel" id="cartPanel">
    <div class="cart-header">
        <h5 class="m-0">Carrito de Pedido</h5>
        <button class="btn-close btn-close-white" onclick="toggleCart()"></button>
    </div>
    <div class="cart-body" id="cartBody">
        <!-- Elementos del carrito -->
    </div>
    <div class="cart-footer">
        <h5 class="text-end mb-3">Total: $<span id="cartTotal">0</span></h5>
        <button class="btn btn-success w-100" onclick="exportCart()"><i class="bi bi-clipboard-check"></i> Generar Resumen para Copiar</button>
    </div>
</div>

<!-- Modal Export -->
<div class="modal fade" id="exportModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Resumen de Pedido</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Copia el siguiente texto para enviarlo por correo o WhatsApp al proveedor:</p>
        <textarea id="exportText" class="form-control" rows="10" readonly></textarea>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-primary" onclick="copyToClipboard()"><i class="bi bi-clipboard"></i> Copiar al Portapapeles</button>
      </div>
    </div>
  </div>
</div>

    }

    function renderTable() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        const list = data[currentTab];
        list.forEach((item, index) => {
            const searchStr = (item.marca + " " + item.nombre).toLowerCase();
            if (query && !searchStr.includes(query)) return;

            const tr = document.createElement('tr');

    function updateCart(tab, index, qtyStr) {

        const cartKey = tab + '_' + item.codigo;

        if (isNaN(qty) || qty <= 0) {
            delete cart[cartKey];
        } else {
            cart[cartKey] = { item, qty, tab };
        }
        renderCart();
    }

                    <div class="card-body p-2 position-relative">
                        <button class="btn-close position-absolute top-0 end-0 m-2" style="font-size: 0.6rem;" onclick="updateCart('${entry.tab}', data['${entry.tab}'].findIndex(i => i.codigo === '${entry.item.codigo}'), 0); document.querySelector('input[value=\'${entry.qty}\']').value = ''; renderTable();"></button>
                        <h6 class="mb-1" style="font-size: 0.9rem;">${entry.item.nombre}</h6>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="badge bg-secondary">${entry.qty} unid.</span>
                            <span class="fw-bold">${formatMoney(subtotal)}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        if (count === 0) {
            html = '<p class="text-center text-muted mt-5">Tu carrito está vacío.</p>';
        }

        cartBody.innerHTML = html;
        document.getElementById('cartTotal').innerText = total.toLocaleString('es-CL');
        document.getElementById('cartBadge').innerText = count;
    }

    function toggleCart() {
        document.getElementById('cartPanel').classList.toggle('open');
        document.getElementById('overlay').classList.toggle('show');
    }

    function exportCart() {
        if (Object.keys(cart).length === 0) {
            alert("Agrega productos al carrito primero.");
            return;
        }
        
        let text = "PEDIDO CYBER MONDAY - FARMACIA SAN PABLO\n";
        text += "=========================================\n\n";
        
        let categories = { 'pharma': [], 'perf': [] };
        for (const key in cart) {
            categories[cart[key].tab].push(cart[key]);
        }

        if(categories['pharma'].length > 0) {
            text += "--- FARMACIA ---\n";
            categories['pharma'].forEach(c => {
                text += `Cód: ${c.item.codigo} | Cant: ${c.qty} | ${c.item.nombre}\n`;
            });
            text += "\n";
        }

        if(categories['perf'].length > 0) {
            text += "--- PERFUMERÍA ---\n";
            categories['perf'].forEach(c => {
                text += `Cód: ${c.item.codigo} | Cant: ${c.qty} | ${c.item.nombre}\n`;
            });
            text += "\n";
        }

        const total = document.getElementById('cartTotal').innerText;
        text += "=========================================\n";
        text += `TOTAL ESTIMADO: $${total}\n`;

        document.getElementById('exportText').value = text;
        const modal = new bootstrap.Modal(document.getElementById('exportModal'));
        modal.show();
    }

    function copyToClipboard() {
        const copyText = document.getElementById('exportText');
        copyText.select();
        copyText.setSelectionRange(0, 99999); 
        navigator.clipboard.writeText(copyText.value).then(() => {
            alert("¡Copiado al portapapeles!");
        });
    }

    // Init
    renderTable();
    renderCart();
</script>
</body>
</html>
